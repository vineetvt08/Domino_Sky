name: CI - Domino Sky Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Type-Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript Type-Check
        run: npm run typecheck

      - name: Run Vitest Unit, Invariant & API Tests
        run: npm test

      - name: Production Bundle Build
        run: npm run build
